<title>Tronco Común de Ingeniería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
:root{
  --papel:#ffffff; --superficie:#f1f4f6; --superficie-2:#e6ebee;
  --tinta:#0f161c; --tinta-2:#48565f; --tinta-3:#7d8b95;
  --regla:#d5dcE0; --regla-2:#b6c0c7;
  --g9:#00304a; --g6:#2b6b88; --g3:#7ba6ba;
  --sobre-g9:#ffffff; --sobre-g9b:#a9c4d3;
  --sobre-g6:#ffffff; --sobre-g6b:#d3e6ef;
  --sobre-g3:#08222e; --sobre-g3b:#2c4f5e;
  --comp-fund:#4a7fa5; --comp-disc:#b5793a; --comp-libre:#5f8f6a; --comp-niv:#98a2aa;
  --foco:#00304a;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --papel:#0d1418; --superficie:#141e25; --superficie-2:#1d2932;
    --tinta:#e8eef2; --tinta-2:#a7b5be; --tinta-3:#77868f;
    --regla:#24323a; --regla-2:#3a4c55;
    --g9:#7fc4e8; --g6:#3d8aad; --g3:#28505f;
    --sobre-g9:#06202b; --sobre-g9b:#2c5568;
    --sobre-g6:#f4fbfe; --sobre-g6b:#cde3ef;
    --sobre-g3:#dcebf2; --sobre-g3b:#9cbccb;
    --comp-fund:#5f9ac4; --comp-disc:#c88f52; --comp-libre:#71a781; --comp-niv:#7c8891;
    --foco:#7fc4e8;
  }
}
:root[data-theme="dark"]{
  --papel:#0d1418; --superficie:#141e25; --superficie-2:#1d2932;
  --tinta:#e8eef2; --tinta-2:#a7b5be; --tinta-3:#77868f;
  --regla:#24323a; --regla-2:#3a4c55;
  --g9:#7fc4e8; --g6:#3d8aad; --g3:#28505f;
  --sobre-g9:#06202b; --sobre-g9b:#2c5568;
  --sobre-g6:#f4fbfe; --sobre-g6b:#cde3ef;
  --sobre-g3:#dcebf2; --sobre-g3b:#9cbccb;
  --comp-fund:#5f9ac4; --comp-disc:#c88f52; --comp-libre:#71a781; --comp-niv:#7c8891;
  --foco:#7fc4e8;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--sans);
  font-size:15px;line-height:1.45;overflow:hidden}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:600}
button{font:inherit;color:inherit;border:0;background:none;text-align:left}
:focus-visible{outline:2px solid var(--foco);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#app{height:100dvh;display:flex;flex-direction:column}

/* ---------- encabezado: solo el título ---------- */
header{flex:none;display:flex;align-items:baseline;gap:16px;padding:14px 24px 12px;
  border-bottom:1px solid var(--regla)}
header h1{font-size:26px;letter-spacing:-.015em;white-space:nowrap}
/* el escudo verde solo va sobre blanco: por eso su propia placa, en ambos temas */
header .escudo{flex:none;align-self:center;background:#fff;border:1px solid var(--regla);
  border-radius:3px;padding:4px 6px;display:flex;align-items:center;line-height:0}
header .escudo img{height:40px;width:auto;display:block}
header .uni{font-size:12.5px;color:var(--tinta-2);letter-spacing:.13em;text-transform:uppercase;
  font-weight:600}

/* ---------- escena ---------- */
#escena{flex:1;display:flex;min-height:0}

/* ---------- panel izquierdo ---------- */
#panel{flex:none;width:392px;border-right:1px solid var(--regla);background:var(--superficie);
  display:flex;flex-direction:column;min-height:0;padding:14px 16px 12px}
.segm{display:flex;border:1px solid var(--regla-2);border-radius:3px;overflow:hidden;flex:none}
.segm button{flex:1;padding:7px 6px;font-size:12px;font-weight:600;color:var(--tinta-2);
  background:var(--papel);border-right:1px solid var(--regla);cursor:pointer;text-align:center;
  transition:background .12s}
.segm button:last-child{border-right:0}
.segm button:hover{background:var(--superficie-2)}
.segm button[aria-pressed="true"]{background:var(--g9);color:var(--sobre-g9)}
.segm .num{font-family:var(--mono);font-size:10.5px;opacity:.72;display:block;font-weight:500}

.cubos{display:flex;gap:4px;margin-top:8px;flex:none}
.cubos button{flex:1;padding:5px 2px;font-family:var(--mono);font-size:11px;text-align:center;
  border:1px solid var(--regla-2);border-radius:2px;background:var(--papel);cursor:pointer;
  color:var(--tinta-2)}
.cubos button:hover{background:var(--superficie-2)}
.cubos button[aria-pressed="true"]{background:var(--g6);color:var(--sobre-g6);
  border-color:var(--g6);font-weight:600}

.rotulo{flex:none;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--tinta-3);font-weight:700;margin:14px 0 8px;display:flex;
  justify-content:space-between;align-items:baseline;gap:8px}
.rotulo em{font-style:normal;font-family:var(--mono);letter-spacing:0;text-transform:none}

/* lista de materias del grado elegido */
#lista{flex:1;min-height:0;display:grid;gap:3px;align-content:start;
  grid-template-columns:1fr;overflow:hidden}
#lista.dos{grid-template-columns:1fr 1fr}
.item{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:2px;
  background:var(--papel);border:1px solid var(--regla);cursor:pointer;min-width:0;
  opacity:0;transform:translateX(26px);animation:entra .34s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes entra{to{opacity:1;transform:none}}
.item:hover{border-color:var(--regla-2);background:var(--superficie-2)}
.item .pt{width:7px;height:7px;border-radius:50%;background:var(--g9);flex:none}
.item .tx{flex:1;font-size:11.5px;font-weight:500;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;min-width:0}
.item .nb{font-family:var(--mono);font-size:10px;color:var(--tinta-3);flex:none}
.item.sel{background:var(--g9);border-color:var(--g9)}
.item.sel .tx{color:var(--sobre-g9);font-weight:600}
.item.sel .nb{color:var(--sobre-g9b)}
.item.sel .pt{background:var(--sobre-g9)}
#lista.dos .item .tx{font-size:10.5px}
.masinfo{font-size:11px;color:var(--tinta-3);font-family:var(--mono);padding:4px 2px}

/* ficha dentro del panel */
#ficha{flex:1;min-height:0;display:flex;flex-direction:column;gap:0;overflow:hidden}
.atras{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-3);
  font-weight:700;cursor:pointer;padding:2px 0 10px;flex:none}
.atras:hover{color:var(--tinta)}
#ficha h3{font-size:19px;line-height:1.2;letter-spacing:-.01em;flex:none}
#ficha .cod{font-family:var(--mono);font-size:12px;color:var(--tinta-2);letter-spacing:.08em;
  margin-top:4px;flex:none}
#ficha .datos{display:flex;gap:16px;margin:10px 0 12px;font-size:12px;color:var(--tinta-2);flex:none}
#ficha .datos b{color:var(--tinta);font-weight:600}
.filas{flex:1;min-height:0;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.fila{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:2px;
  background:var(--papel);border:1px solid var(--regla);font-size:11.5px;cursor:pointer;
  opacity:0;animation:entra .3s cubic-bezier(.2,.7,.3,1) forwards}
.fila.no{background:transparent;border-color:transparent;color:var(--tinta-3);cursor:default}
.fila b{flex:1;font-weight:600}
.fila .donde{font-family:var(--mono);font-size:10px;color:var(--tinta-3)}
.fila .pt{width:8px;height:8px;border-radius:50%;background:var(--g9);flex:none}
.fila.no .pt{background:var(--regla-2)}
.fila.cat .pt{background:transparent;border:2px solid var(--g6)}

.leyenda{flex:none;border-top:1px solid var(--regla);margin-top:10px;padding-top:9px;
  display:flex;flex-wrap:wrap;gap:5px 12px;font-size:10px;color:var(--tinta-3)}
.leyenda i{display:inline-block;width:14px;height:9px;border-radius:2px;margin-right:5px;
  vertical-align:0;border:1px solid var(--regla-2)}

/* ---------- tablero de mallas ---------- */
#tablero{flex:1;min-height:0;padding:12px;display:grid;gap:10px;
  grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
#tablero.solo{grid-template-columns:1fr;grid-template-rows:1fr}

.tile{position:relative;border:1px solid var(--regla);border-radius:4px;background:var(--papel);
  overflow:hidden;display:flex;flex-direction:column;transition:opacity .18s}
.tile.oculta{display:none}
.tile.apaga{opacity:.3}
.tile.marca{border-color:var(--foco);box-shadow:inset 0 0 0 1px var(--foco)}
.tile .cab{flex:none;display:flex;align-items:baseline;gap:8px;padding:6px 9px;
  border-bottom:1px solid var(--regla);background:var(--superficie);cursor:pointer;width:100%}
.tile .cab:hover{background:var(--superficie-2)}
.tile .cab h2{font-size:13px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.tile .cab .info{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--tinta-3);
  white-space:nowrap}
.tile.abierta .cab h2{font-size:22px}
.tile.abierta .cab{padding:10px 14px}
.tile.abierta .cab .info{font-size:12px}
.lienzo{flex:1;position:relative;overflow:hidden}
.malla{position:absolute;left:0;top:0;transform-origin:0 0}

.sem{display:grid;gap:4px;align-items:start}
.semcab{font-family:var(--mono);font-size:10px;color:var(--tinta-3);text-align:center;
  padding-bottom:4px;border-bottom:1px solid var(--regla);letter-spacing:.05em}
.mat{border:1px solid var(--regla);border-left:3px solid var(--comp-niv);border-radius:2px;
  background:var(--papel);padding:4px 5px 4px 6px;cursor:pointer;display:block;width:100%;
  min-height:66px;transition:opacity .18s}
.mat .n{font-size:10px;line-height:1.2;font-weight:500;color:var(--tinta-2);
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
  overflow-wrap:anywhere;hyphens:auto}
.mat .c{font-family:var(--mono);font-size:8.5px;color:var(--tinta-3);margin-top:3px;
  display:flex;justify-content:space-between;gap:4px}
.mat[data-g="9"]{background:var(--g9);border-color:var(--g9)}
.mat[data-g="9"] .n{color:var(--sobre-g9);font-weight:600}
.mat[data-g="9"] .c{color:var(--sobre-g9b)}
.mat[data-g="6"]{background:var(--g6);border-color:var(--g6)}
.mat[data-g="6"] .n{color:var(--sobre-g6);font-weight:600}
.mat[data-g="6"] .c{color:var(--sobre-g6b)}
.mat[data-g="3"]{background:var(--g3);border-color:var(--g3)}
.mat[data-g="3"] .n{color:var(--sobre-g3);font-weight:600}
.mat[data-g="3"] .c{color:var(--sobre-g3b)}
.mat.apagada{opacity:.13}
.mat.opt{border-style:dashed}
.mat.pulso{animation:pulso .55s ease}
@keyframes pulso{0%,100%{transform:scale(1)}45%{transform:scale(1.09)}}

/* copia que vuela hacia el panel */
.vuela{position:fixed;z-index:60;border-radius:2px;background:var(--g9);
  border:1px solid var(--g9);color:var(--sobre-g9);padding:4px 6px;overflow:hidden;
  box-shadow:0 8px 22px rgba(0,48,71,.28);pointer-events:none;font-size:10px;
  font-weight:600;line-height:1.15}

.pie{position:absolute;right:10px;bottom:8px;font-size:10px;color:var(--tinta-3);
  font-family:var(--mono);pointer-events:none}

/* pantallas pequeñas: se permite desplazar, si no es inusable */
@media (max-width:1000px){
  body{overflow:auto}
  #app{height:auto}
  #escena{flex-direction:column}
  #panel{width:auto;border-right:0;border-bottom:1px solid var(--regla)}
  #lista{max-height:46vh}
  #tablero{grid-template-columns:1fr;grid-template-rows:none}
  .tile{height:52vh}
}
</style>

ibuja 15; mecatronica tiene dos asignaturas de creditos variables y se tomo el minimo, unico valor que cuadra con los subtotales por componente. Los prerrequisitos se pudieron reconstruir en 5 de las 9 carreras; en mecatronica, sistemas, electronica y mecanica las etiquetas de conector son ambiguas y se dejaron vacios en vez de adivinarlos."};

<script>
(function(){
"use strict";
var D = window.MALLAS;
var panel = document.getElementById("panel");
var tablero = document.getElementById("tablero");
if (!D || !D.carreras || !D.carreras.length){
  panel.textContent = "No hay datos cargados."; return;
}
var CARRERAS = D.carreras, N = CARRERAS.length;
var ROMANO = ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];
var COMP = { fundamentacion:"--comp-fund", disciplinar:"--comp-disc",
             libre_eleccion:"--comp-libre", nivelacion:"--comp-niv" };
var NOMCOMP = { fundamentacion:"Fundamentación", disciplinar:"Disciplinar",
                libre_eleccion:"Libre elección", nivelacion:"Nivelación" };
var corto = function(s){ return s.replace(/^Ingenier(i|í)a\s+(de\s+)?/i, ""); };
var real = function(m){ return !!m.codigo && m.codigo !== "CLE"; };
var elem = function(t, cls, padre){
  var d = document.createElement(t); if (cls) d.className = cls;
  if (padre) padre.appendChild(d); return d;
};

/* ---------- índice ---------- */
var IDX = {};
CARRERAS.forEach(function(c){
  c.materias.forEach(function(m){
    if (!real(m)) return;
    var e = IDX[m.codigo] || (IDX[m.codigo] = { cod:m.codigo, nombre:m.nombre,
      creditos:m.creditos, componente:m.componente, donde:{} });
    if ((m.nombre || "").length > (e.nombre || "").length) e.nombre = m.nombre;
    if (!e.creditos && m.creditos) e.creditos = m.creditos;
    var prev = e.donde[c.id];
    if (!prev || (!prev.sem && m.semestre)) e.donde[c.id] = { sem:m.semestre || 0 };
  });
});
var grado = function(cod){ var e = IDX[cod]; return e ? Object.keys(e.donde).length : 0; };
var enMalla = function(cod){
  var e = IDX[cod];
  return Object.keys(e.donde).filter(function(k){ return e.donde[k].sem > 0; }).length;
};
var banda = function(g){ return g >= N ? "9" : (g >= Math.ceil(N/2) ? "6" : (g >= 2 ? "3" : "1")); };
var CODIGOS = Object.keys(IDX);
var G1 = CODIGOS.filter(function(k){ return grado(k) === N; });
var G2 = CODIGOS.filter(function(k){ var g = grado(k); return g >= 2 && g < N; });
var G3 = CODIGOS.filter(function(k){ return grado(k) === 1; });
var orden = function(a, b){
  var d = grado(b) - grado(a); if (d) return d;
  return IDX[a].nombre.localeCompare(IDX[b].nombre, "es");
};
G1.sort(orden); G2.sort(orden); G3.sort(orden);

var estado = { grado:"g1", cubo:null, cod:null, abierta:null };

/* ---------- panel ---------- */
var segm = elem("div", "segm", panel);
var BOT = [{ id:"g1", t:"Grado 1", n:G1.length }, { id:"g2", t:"Grado 2", n:G2.length },
           { id:"g3", t:"Propias", n:G3.length }];
BOT.forEach(function(o){
  var b = elem("button", null, segm);
  b.type = "button"; b.dataset.g = o.id;
  b.innerHTML = o.t + '<span class="num">' + o.n + '</span>';
  b.addEventListener("click", function(){ estado.grado = o.id; estado.cubo = null; estado.cod = null; verLista(true); });
});
var cubos = elem("div", "cubos", panel);
var niveles = [];
G2.forEach(function(k){ var g = grado(k); if (niveles.indexOf(g) < 0) niveles.push(g); });
niveles.sort(function(a, b){ return b - a; });
[{ n:null, t:"todas" }].concat(niveles.map(function(n){ return { n:n, t:String(n) }; }))
.forEach(function(o){
  var b = elem("button", null, cubos);
  b.type = "button"; b.dataset.n = (o.n === null ? "" : String(o.n));
  b.textContent = o.t;
  b.addEventListener("click", function(){ estado.cubo = o.n; estado.cod = null; verLista(true); });
});
var rotulo = elem("div", "rotulo", panel);
var lista = elem("div", null, panel); lista.id = "lista";
var ficha = elem("div", null, panel); ficha.id = "ficha"; ficha.hidden = true;
var leyenda = elem("div", "leyenda", panel);
leyenda.innerHTML = '<span><i style="background:var(--g9)"></i>en las ' + N + '</span>'
  + '<span><i style="background:var(--g6)"></i>5 a ' + (N - 1) + '</span>'
  + '<span><i style="background:var(--g3)"></i>2 a 4</span>'
  + '<span><i style="background:var(--papel)"></i>propia</span>'
  + '<span style="opacity:.8">franja izquierda = componente</span>';

/* ---------- tablero ---------- */
var nodos = CARRERAS.map(function(car, i){
  var tile = elem("div", "tile", tablero);
  var cab = elem("button", "cab", tile);
  cab.type = "button";
  var rej = car.materias.filter(function(m){ return m.semestre > 0; });
  var nCols = rej.reduce(function(a, m){ return Math.max(a, m.semestre); }, 1);
  cab.innerHTML = '<h2>' + corto(car.nombre) + '</h2>'
    + '<span class="info">' + rej.length + ' asig · ' + car.creditosTotal + ' cr</span>';
  cab.addEventListener("click", function(){ abrir(estado.abierta === i ? null : i); });

  var lienzo = elem("div", "lienzo", tile);
  var malla = elem("div", "malla", lienzo);
  var g = elem("div", "sem", malla);
  g.style.gridTemplateColumns = "repeat(" + nCols + ",92px)";
  for (var s = 0; s < nCols; s++){
    var h = elem("div", "semcab", g);
    h.textContent = ROMANO[s] || (s + 1);
    h.style.gridColumn = (s + 1); h.style.gridRow = 1;
  }
  var botones = [];
  rej.forEach(function(m){
    var b = elem("button", "mat" + (m.optativa ? " opt" : ""), g);
    b.type = "button";
    b.style.gridColumn = m.semestre;
    b.style.gridRow = (m.fila || 0) + 2;
    b.style.borderLeftColor = "var(" + (COMP[m.componente] || "--comp-niv") + ")";
    if (real(m)) b.dataset.g = banda(grado(m.codigo));
    b.dataset.cod = real(m) ? m.codigo : "";
    b.innerHTML = '<span class="n">' + m.nombre + '</span><span class="c"><span>'
      + (m.codigo || "—") + '</span><span>' + (m.creditos != null ? m.creditos : "") + '</span></span>';
    if (real(m)) b.addEventListener("click", function(ev){ ev.stopPropagation(); verFicha(m.codigo, true); });
    botones.push(b);
  });
  var pie = elem("div", "pie", tile);
  pie.textContent = nCols + " semestres";
  return { tile:tile, malla:malla, botones:botones, car:car };
});

/* escala cada malla para que quepa entera en su recuadro: nada de scroll */
function escalar(){
  nodos.forEach(function(nc){
    var caja = nc.malla.parentNode;
    nc.malla.style.transform = "none";
    var nw = nc.malla.scrollWidth, nh = nc.malla.scrollHeight;
    var dw = caja.clientWidth - 14, dh = caja.clientHeight - 14;
    if (!nw || !nh || dw <= 0 || dh <= 0) return;
    var s = Math.min(dw / nw, dh / nh);
    var ox = 7 + Math.max(0, (dw - nw * s) / 2);
    var oy = 7 + Math.max(0, (dh - nh * s) / 2);
    nc.malla.style.transform = "translate(" + ox + "px," + oy + "px) scale(" + s + ")";
  });
}
window.addEventListener("resize", escalar);

function abrir(i){
  estado.abierta = i;
  nodos.forEach(function(nc, k){
    nc.tile.classList.toggle("oculta", i !== null && k !== i);
    nc.tile.classList.toggle("abierta", i !== null && k === i);
  });
  tablero.classList.toggle("solo", i !== null);
  requestAnimationFrame(escalar);
}

/* ---------- lista del grado ---------- */
function activos(){
  if (estado.grado === "g1") return G1;
  if (estado.grado === "g3") return G3;
  return estado.cubo === null ? G2 : G2.filter(function(k){ return grado(k) === estado.cubo; });
}
function verLista(animar){
  ficha.hidden = true; lista.hidden = false;
  Array.prototype.forEach.call(segm.children, function(b){
    b.setAttribute("aria-pressed", String(b.dataset.g === estado.grado));
  });
  cubos.hidden = estado.grado !== "g2";
  Array.prototype.forEach.call(cubos.children, function(b){
    b.setAttribute("aria-pressed", String(b.dataset.n === (estado.cubo === null ? "" : String(estado.cubo))));
  });

  var cods = activos();
  var titulo = estado.grado === "g1" ? "Las mismas en las " + N + " carreras"
    : (estado.grado === "g2"
        ? (estado.cubo === null ? "Compartidas por varias" : "Compartidas por " + estado.cubo)
        : "Propias de una sola carrera");
  rotulo.innerHTML = titulo + "<em>" + cods.length + "</em>";

  /* cuántas caben sin desplazar */
  var alto = lista.clientHeight || 400;
  var dos = cods.length > Math.floor(alto / 27);
  lista.classList.toggle("dos", dos);
  var filas = Math.max(1, Math.floor(alto / 27));
  var caben = dos ? filas * 2 : filas;
  var muestra = cods.slice(0, cods.length > caben ? caben - 1 : caben);

  lista.innerHTML = "";
  muestra.forEach(function(cod, k){
    var e = IDX[cod];
    var it = elem("button", "item", lista);
    it.type = "button";
    it.style.animationDelay = (animar ? Math.min(k * 22, 620) : 0) + "ms";
    it.innerHTML = '<i class="pt" style="background:var(--g' + banda(grado(cod)).replace("1", "3") + ')"></i>'
      + '<span class="tx">' + e.nombre + '</span><span class="nb">' + grado(cod) + '</span>';
    it.addEventListener("click", function(){ verFicha(cod, true); });
    it.addEventListener("mouseenter", function(){ resaltar(cod); });
    it.addEventListener("mouseleave", function(){ if (!estado.cod) resaltar(null); });
  });
  if (cods.length > muestra.length){
    var m = elem("div", "masinfo", lista);
    m.textContent = "+ " + (cods.length - muestra.length) + " más — filtra por número";
  }
  resaltar(null);
  pintarMallas(cods);
  if (animar) desplegarConjunto(muestra);
}

/* al cambiar de grado: una copia de cada materia sale de una malla y cae en la lista */
function desplegarConjunto(cods){
  var items = lista.querySelectorAll(".item");
  var tope = Math.min(cods.length, 14);
  for (var k = 0; k < tope; k++){
    (function(k){
      var cod = cods[k], destino = items[k];
      if (!destino) return;
      var origen = null;
      for (var i = 0; i < nodos.length && !origen; i++){
        nodos[i].botones.forEach(function(b){
          if (!origen && b.dataset.cod === cod) origen = b;
        });
      }
      if (!origen) return;
      volarCopia(origen, destino, IDX[cod].nombre, k * 46, 0.9);
    })(k);
  }
}

/* mueve una copia de una tarjeta hasta su destino en el panel */
function volarCopia(origen, destino, texto, retraso, escFinal){
  var r = origen.getBoundingClientRect(), d = destino.getBoundingClientRect();
  if (r.width < 2 || d.width < 2) return;
  var v = elem("div", "vuela", document.body);
  v.textContent = texto;
  v.style.left = r.left + "px"; v.style.top = r.top + "px";
  v.style.width = Math.max(r.width, 90) + "px";
  v.style.height = Math.max(r.height, 24) + "px";
  v.style.transition = "transform .60s cubic-bezier(.35,.05,.2,1), opacity .60s ease";
  v.style.transitionDelay = retraso + "ms";
  requestAnimationFrame(function(){
    v.style.transform = "translate(" + (d.left - r.left) + "px," + (d.top - r.top)
      + "px) scale(" + escFinal + ")";
    v.style.opacity = "0";
  });
  setTimeout(function(){ v.remove(); }, 1100 + retraso);
}

/* resalta en las mallas las materias del conjunto activo */
function pintarMallas(cods){
  var set = {}; cods.forEach(function(c){ set[c] = 1; });
  nodos.forEach(function(nc){
    nc.tile.classList.remove("apaga", "marca");
    nc.botones.forEach(function(b){
      b.classList.toggle("apagada", !(b.dataset.cod && set[b.dataset.cod]));
    });
  });
}
function resaltar(cod){
  if (!cod){ pintarMallas(activos()); return; }
  var e = IDX[cod];
  nodos.forEach(function(nc){
    var la = !!e.donde[nc.car.id];
    nc.tile.classList.toggle("apaga", !la);
    nc.tile.classList.toggle("marca", la);
    nc.botones.forEach(function(b){ b.classList.toggle("apagada", b.dataset.cod !== cod); });
  });
}

/* ---------- ficha + animación de despliegue ---------- */
function verFicha(cod, volar){
  estado.cod = cod;
  var e = IDX[cod], g = grado(cod), eM = enMalla(cod);
  lista.hidden = true; ficha.hidden = false;
  var filas = CARRERAS.map(function(c, k){
    var d = e.donde[c.id];
    var cls = d ? (d.sem > 0 ? "fila" : "fila cat") : "fila no";
    var donde = d ? (d.sem > 0 ? ("sem " + (ROMANO[d.sem - 1] || d.sem)) : "catálogo") : "no la tiene";
    return '<button type="button" class="' + cls + '" data-i="' + k + '" style="animation-delay:'
      + (60 + k * 34) + 'ms"><i class="pt"></i><b>' + corto(c.nombre) + '</b>'
      + '<span class="donde">' + donde + '</span></button>';
  }).join("");
  ficha.innerHTML = '<button type="button" class="atras">&larr; volver a la lista</button>'
    + '<h3>' + e.nombre + '</h3><div class="cod">' + e.cod + '</div>'
    + '<div class="datos"><span><b>' + g + '</b> de ' + N + ' carreras</span>'
    + '<span><b>' + (e.creditos || "—") + '</b> créditos</span>'
    + '<span>' + (NOMCOMP[e.componente] || "—") + '</span></div>'
    + '<div class="filas">' + filas + '</div>';
  ficha.querySelector(".atras").addEventListener("click", function(){ estado.cod = null; verLista(false); });
  Array.prototype.forEach.call(ficha.querySelectorAll(".fila:not(.no)"), function(f){
    f.addEventListener("click", function(){ abrir(Number(f.dataset.i)); });
  });
  resaltar(cod);
  desplegar(cod, volar);
  if (eM !== g){
    var av = elem("div", "masinfo", ficha);
    av.textContent = "obligatoria en " + eM + ", en catálogo en " + (g - eM);
  }
}

/* una copia sale de cada malla que la tiene y se recoge en el panel */
function desplegar(cod, volar){
  nodos.forEach(function(nc){
    nc.botones.forEach(function(b){
      if (b.dataset.cod === cod){
        b.classList.remove("pulso");
        void b.offsetWidth;
        b.classList.add("pulso");
      }
    });
  });
  if (!volar) return;
  /* una copia por cada malla que la tiene: convergen todas sobre el título de la ficha */
  var destino = ficha.querySelector("h3");
  nodos.forEach(function(nc, i){
    var origen = null;
    nc.botones.forEach(function(b){ if (b.dataset.cod === cod) origen = b; });
    if (origen) volarCopia(origen, destino, IDX[cod].nombre, i * 38, 0.75);
  });
}

document.addEventListener("keydown", function(ev){
  if (ev.key === "Escape"){
    if (estado.abierta !== null) abrir(null);
    else if (estado.cod){ estado.cod = null; verLista(false); }
  }
});

verLista(false);
requestAnimationFrame(function(){ escalar(); verLista(true); });
})();
</script>
